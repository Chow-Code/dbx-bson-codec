name: Validate BSON codec
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: windows-x64 }
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: macos-15, target: darwin-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native tests, package verification and executable smoke
        run: node scripts/ci.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.target }}
          path: dist/*/*
          if-no-files-found: error
