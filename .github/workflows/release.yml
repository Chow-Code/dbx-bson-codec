name: Publish unsigned review candidate
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify candidate
        shell: pwsh
        run: |
          ./build.ps1
          go vet ./...
          ./scripts/verify-package.ps1 -Package (Get-ChildItem dist/*.dbxp).FullName -ExtractDirectory work/verified
          node scripts/smoke.mjs "$PWD/work/verified/bin/windows-x64/backend.exe"
          node scripts/release-metadata.mjs
      - name: Upload review candidates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.event.release.tag_name }}' (Get-ChildItem dist/* | ForEach-Object FullName) --repo '${{ github.repository }}'
