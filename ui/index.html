<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redis BSON Codec</title><style>
*{box-sizing:border-box}body{margin:0;padding:28px;font:14px/1.6 system-ui,sans-serif;color:var(--color-foreground,#e4e7ed);background:var(--color-background,#14171d)}main{max-width:1000px;margin:auto}h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0 0 10px}.hint{color:var(--color-muted-foreground,#9da7b6)}section{margin-top:24px;padding:20px;border:1px solid var(--color-border,#343c47);border-radius:12px}textarea{width:100%;min-height:220px;resize:vertical;font:13px/1.6 Consolas,monospace;padding:12px;border-radius:8px;border:1px solid var(--color-border,#424b5b);background:var(--color-muted,#202631);color:inherit}button,select{font:inherit;padding:7px 15px;border:1px solid var(--color-border,#424b5b);border-radius:7px;background:var(--color-muted,#283241);color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:12px;align-items:center;margin:12px 0;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;background:var(--color-muted,#202631);border-radius:8px;max-height:420px;overflow:auto}[role=alert]{color:#ee9b96;white-space:pre-wrap}label{font-weight:600}small{display:block}#testInput{min-height:100px}
</style></head><body><main>
<h1 id="title">Redis BSON Codec</h1><div class="hint" id="intro"></div>
<div class="row"><label id="codecLabel" for="codec">Codec</label><select id="codec" aria-label="Codec"><option value="bson">BSON (Canonical Extended JSON)</option><option value="external-program">Custom external program</option></select><button id="sample">Load BSON sample</button></div>
<p id="error" role="alert"></p><p id="status" role="status"></p>
<section><h2 id="configHeading"></h2><p class="hint" id="configHelp"></p><textarea id="config" spellcheck="false" aria-label="Codec configuration"></textarea><div class="row"><button id="save"></button><button id="reload"></button></div></section>
<section><h2 id="testHeading"></h2><div class="row"><select id="operation" aria-label="Operation"><option value="decode">Decode Base64 → JSON / text</option><option value="encode">Encode JSON / text → Base64</option></select><select id="inputFormat" aria-label="Encoder input format"><option value="json">JSON</option><option value="text">Text</option></select></div><textarea id="testInput" spellcheck="false" aria-label="Test input"></textarea><div class="row"><button id="run"></button><button id="roundtrip"></button></div><pre id="result" aria-live="polite"></pre></section>
</main><script src="app.js"></script></body></html>
